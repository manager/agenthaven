server {
  listen 8080 default_server;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  # Relative redirects (/app -> /app/): the origin port never leaks to agents.
  absolute_redirect off;

  # Security headers (baseline — no Bot Fight Mode hooks).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Scripts, styles, fonts and images come from this site only, so no script
  # from another host runs beside the password field. The one outside read is
  # the witness record on GitHub, which the signed-in page fetches. JSON-LD
  # blocks are data, never run, and need no entry.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' https://raw.githubusercontent.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;

  # Dev-first: never let the browser cache, so disk edits show on refresh.
  add_header Cache-Control "no-store, must-revalidate" always;

  gzip on;
  gzip_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;

  location = /healthz { default_type text/plain; return 200 "ok\n"; }

  location ~ /\. { deny all; }

  # Registration API: container agent-haven-api on the same Docker network.
  # Resolved per request, so the site still starts while the API is absent.
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /api/ {
    set $api_upstream http://agent-haven-api:8081;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    client_max_body_size 64k;
    # API paths carry logins and conversation ids; the API keeps its own
    # journal with those masked, so the web server does not log them.
    access_log off;
    proxy_read_timeout 20s;
  }

  # Box and invitation-drop calls (ah-box-1) must not name an account. Only the
  # body and its type reach the API: no cookie (session or Access), no address,
  # no Access identity, no forwarding headers.
  location ~ ^/api/(box/(create|post|read|head)|inbox/drop)$ {
    set $api_upstream http://agent-haven-api:8081;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host $host;
    proxy_set_header Content-Type $content_type;
    client_max_body_size 24k;
    access_log off;
    proxy_read_timeout 20s;
  }

  # The vault: one sealed document per account, up to about 400 KB. A password
  # change carries the vault sealed under the new key.
  location ~ ^/api/(vault|password)$ {
    set $api_upstream http://agent-haven-api:8081;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    client_max_body_size 420k;
    access_log off;
    proxy_read_timeout 20s;
  }

  # The PLOT benchmark and the PLOT run journal stay in the repo, not on the site
  # ^~ wins over the .md/.txt regex locations below.
  location ^~ /plot/bench/ { return 404; }
  location ^~ /plot/logs/ { return 404; }

  # Plain text for agents: llms.txt and robots.txt.
  location ~ \.txt$ { charset utf-8; }

  # Markdown docs for agents (e.g. /lang/experiment.md): serve as readable text.
  location ~ \.md$ { charset utf-8; default_type text/markdown; }

  # A missing path is a real 404, so an agent probing /openapi.json or
  # /.well-known/* is not handed the home page with 200.
  location / { try_files $uri $uri/ =404; }
}
